server {
    listen 80;
    root /usr/share/nginx/html;

    # DNS de Docker: "gateway" se resuelve en cada pedido, no solo al arrancar. Así nginx arranca
    # aunque el API Gateway todavía no esté levantado, y sigue funcionando si cambia de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8000;

    # Cajero
    location = / {
        try_files /index.html =404;
    }

    # Página de pago: el QR apunta a /pay/{id}
    location /pay/ {
        try_files /pay.html =404;
    }

    # La página de pago llama a la API en su mismo origen
    location /api/ {
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri =404;
    }
}
